<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title></title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="lang-en">

<div class="cursor"></div>

<header class="nav">
  <a href="#" class="logo">BJ.</a>

  <nav class="nav-links">
    <a href="#work" data-i18n="nav.work"></a>
    <a href="#about" data-i18n="nav.about"></a>
    <a href="#services" data-i18n="nav.services"></a>
    <a href="#contact" data-i18n="nav.contact"></a>
  </nav>

  <div class="nav-right">
    <a href="#contact" class="nav-contact">
      <span data-i18n="nav.talk"></span>
      <span>↗</span>
    </a>

    <button class="language-switch" id="languageSwitch" type="button">
      <span class="lang-en-label">FA</span>
      <span class="lang-fa-label">EN</span>
    </button>
  </div>
</header>

<main>

<section class="hero">
  <div class="hero-top">
    <span class="eyebrow" data-i18n="hero.eyebrow"></span>

    <span class="hero-location" data-i18n="hero.location"></span>
  </div>

  <div class="hero-title-wrap">
    <h1 class="hero-name">
      <span data-i18n="hero.name.first"></span>
      <span data-i18n="hero.name.last"></span>
    </h1>

    <div class="hero-orb">
      <div class="orb-inner"></div>
    </div>
  </div>

  <div class="hero-bottom">
    <p class="hero-description" data-i18n="hero.description"></p>

    <a href="#work" class="scroll-down">
      <span data-i18n="hero.scroll"></span>
      <strong>↓</strong>
    </a>
  </div>
</section>

<section class="intro">
  <div class="section-number">01 / 04</div>

  <div class="intro-content">
    <p class="big-text">
      <span data-i18n="intro.highlight"></span><span data-i18n="intro.text"></span>
    </p>
  </div>
</section>

<section class="work" id="work">

  <div class="section-heading">
    <div>
      <span class="eyebrow" data-i18n="work.eyebrow"></span>

      <h2>
        <span data-i18n="work.title.first"></span><br>
        <i data-i18n="work.title.second"></i>
      </h2>
    </div>

    <span class="section-number">02 / 04</span>
  </div>

  <article class="project project-large">
    <div class="project-visual embassy">
      <div class="visual-grid"></div>

      <div class="terminal">
        <div class="terminal-top">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="terminal-content">
          <p><span class="green">SYSTEM</span> embassy_bot</p>
          <p data-i18n="projects.embassy.terminal.search"></p>
          <p class="highlight" data-i18n="projects.embassy.terminal.found"></p>
          <p data-i18n="projects.embassy.terminal.booking"></p>
          <p class="success" data-i18n="projects.embassy.terminal.success"></p>
        </div>
      </div>
    </div>

    <div class="project-info">
      <div>
        <span class="project-index">01</span>

        <h3>
          <span data-i18n="projects.embassy.title.first"></span><br>
          <i data-i18n="projects.embassy.title.second"></i>
        </h3>
      </div>

      <div class="project-meta">
        <p data-i18n="projects.embassy.description"></p>

        <span class="project-year">2023</span>
      </div>
    </div>
  </article>

  <article class="project project-reverse">
    <div class="project-info">
      <div>
        <span class="project-index">02</span>

        <h3>
          KhabarAr<br>
          <i data-i18n="projects.khabarar.title"></i>
        </h3>
      </div>

      <div class="project-meta">
        <p data-i18n="projects.khabarar.description"></p>

        <span class="project-year">Telegram · AI</span>
      </div>
    </div>

    <div class="project-visual news">
      <div class="news-card">
        <div class="news-header">
          <span>KHABARAR</span>
          <span>LIVE</span>
        </div>

        <div class="news-line large"></div>
        <div class="news-line"></div>
        <div class="news-line short"></div>

        <div class="news-tag" data-i18n="projects.khabarar.tag"></div>

        <div class="news-title">
          <span data-i18n="projects.khabarar.visual.first"></span><br>
          <span data-i18n="projects.khabarar.visual.second"></span>
        </div>
      </div>
    </div>
  </article>

  <article class="project project-large">
    <div class="project-visual irt">
      <div class="irt-image-wrap">
        <img
          src="https://drive.google.com/thumbnail?id=1kj4k93dU84yRZ9LTAM7mGsDc_NQ3i28e&sz=w1600"
          alt=""
          data-i18n-alt="projects.irt.imageAlt"
          class="irt-image"
        >
      </div>
    </div>

    <div class="project-info">
      <div>
        <span class="project-index">03</span>

        <h3>
          IRT<br>
          <i data-i18n="projects.irt.title"></i>
        </h3>
      </div>

      <div class="project-meta">
        <p data-i18n="projects.irt.description"></p>

        <span class="project-year" data-i18n="projects.irt.meta"></span>
      </div>
    </div>
  </article>

  <div class="more-projects">
    <span data-i18n="work.more"></span>
    <span>•••</span>
  </div>

</section>

<section class="services" id="services">

  <div class="section-heading">
    <div>
      <span class="eyebrow" data-i18n="services.eyebrow"></span>

      <h2>
        <span data-i18n="services.title.first"></span><br>
        <i data-i18n="services.title.second"></i>
      </h2>
    </div>

    <span class="section-number">03 / 04</span>
  </div>

  <div class="service-list">

    <div class="service">
      <span class="service-number">01</span>

      <div>
        <h3 data-i18n="services.items.entrepreneurship.title"></h3>
        <p data-i18n="services.items.entrepreneurship.description"></p>
      </div>

      <span class="service-arrow">↗</span>
    </div>

    <div class="service">
      <span class="service-number">02</span>

      <div>
        <h3 data-i18n="services.items.software.title"></h3>
        <p data-i18n="services.items.software.description"></p>
      </div>

      <span class="service-arrow">↗</span>
    </div>

    <div class="service">
      <span class="service-number">03</span>

      <div>
        <h3 data-i18n="services.items.frontend.title"></h3>
        <p data-i18n="services.items.frontend.description"></p>
      </div>

      <span class="service-arrow">↗</span>
    </div>

    <div class="service">
      <span class="service-number">04</span>

      <div>
        <h3 data-i18n="services.items.automation.title"></h3>
        <p data-i18n="services.items.automation.description"></p>
      </div>

      <span class="service-arrow">↗</span>
    </div>

    <div class="service">
      <span class="service-number">05</span>

      <div>
        <h3 data-i18n="services.items.scraping.title"></h3>
        <p data-i18n="services.items.scraping.description"></p>
      </div>

      <span class="service-arrow">↗</span>
    </div>

  </div>
</section>

<section class="about" id="about">
  <div class="section-number">04 / 04</div>

  <div class="about-content">
    <span class="eyebrow" data-i18n="about.eyebrow"></span>

    <h2>
      <span data-i18n="about.title.first"></span><br>
      <span data-i18n="about.title.highlight"></span><br>
      <span data-i18n="about.title.last"></span>
    </h2>

    <p data-i18n="about.paragraph1"></p>

    <p data-i18n="about.paragraph2"></p>
  </div>
</section>

<section class="contact" id="contact">
  <div class="contact-top">
    <span class="eyebrow" data-i18n="contact.eyebrow"></span>
  </div>

  <h2>
    <span data-i18n="contact.title.first"></span><br>
    <i data-i18n="contact.title.second"></i>
  </h2>

  <a href="mailto:contact@barsamjahanvash.ir" class="email">
    contact@barsamjahanvash.ir
    <span>↗</span>
  </a>
</section>

</main>

<footer>
  <div class="footer-logo">BJ.</div>

  <div class="footer-middle">
    <span id="footerCopyright"></span>
    <span data-i18n="footer.tagline"></span>
  </div>

  <div class="footer-socials">
    <a href="#" aria-label="Instagram">IG</a>
    <a href="#" aria-label="LinkedIn">LI</a>
    <a href="#" aria-label="GitHub">GH</a>
  </div>
</footer>

<script src="script.js"></script>

</body>
</html>
